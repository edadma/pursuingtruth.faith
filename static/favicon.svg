<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    pursuingtruth.faith favicon — a simple flame.
    The site's palette is "reading lamp + ink + parchment"; the flame
    is the lamp's light. Echoes Psalm 119:105 ("thy word is a lamp
    unto my feet") and the tongues of fire in Acts 2. Transparent
    background so it works against any browser chrome; CSS inside
    the SVG flips the colours for OS dark mode.
  -->
  <style>
    .flame-outer { fill: #b45309; } /* amber-700  — site brand */
    .flame-inner { fill: #fbbf24; } /* amber-400  — bright core */
    @media (prefers-color-scheme: dark) {
      .flame-outer { fill: #fbbf24; } /* amber-400 */
      .flame-inner { fill: #fef3c7; } /* amber-100 — almost cream */
    }
  </style>

  <!-- Outer flame silhouette: slim teardrop with a slight lean. -->
  <path class="flame-outer" d="
    M 16 3
    C 17.2 7.5, 21.5 10, 22 15.5
    C 22.4 21, 19.4 27, 16 27
    C 12.4 27, 9.6 22, 10 17
    C 10.3 13.5, 12.8 12.5, 13 10
    C 13.2 7.5, 14.5 5.5, 16 3 Z" />

  <!-- Inner flame: hotter core, slightly off-centre for a hand-drawn feel. -->
  <path class="flame-inner" d="
    M 16 11
    C 16.5 13.5, 18.6 14.5, 19 17.5
    C 19.3 20.5, 17.8 23.8, 16 23.8
    C 14.1 23.8, 12.7 20.5, 13 17.5
    C 13.2 15, 14.7 14, 15.3 12.2 Z" />
</svg>
